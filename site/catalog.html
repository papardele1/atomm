<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="description" content="Каталог ATOMM: смартфоны, ноутбуки, планшеты, часы, наушники, приставки и техника Dyson. Только новая оригинальная техника, доставка по Москве.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Каталог — ATOMM</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#d7d9dc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1e21;--mute:#6b6f75;--line:rgba(28,30,33,.13);--card:#e9eaec;--tile:#dfe1e4;--bg:#d9dbde;--red:#a8323a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 70% at 50% 0%,#eef0f2 0%,#d9dbde 55%,#cbced2 100%) fixed}
a{color:inherit}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:28px;padding:16px 32px;background:rgba(223,225,228,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:15px;letter-spacing:.34em;text-decoration:none;white-space:nowrap}
.logo i{font-style:normal;color:var(--mute);letter-spacing:.1em;margin-left:6px;font-weight:300}
.search{flex:1;max-width:620px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:rgba(245,246,247,.7);border-radius:999px;padding:11px 18px 11px 42px;font-size:14px;outline:none;transition:border .2s,background .2s}
.search input:focus{border-color:rgba(28,30,33,.4);background:#f5f6f7}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.5}
.hnav{display:flex;gap:22px;margin-left:auto}
.hnav a{text-decoration:none;opacity:.65}.hnav a:hover{opacity:1}
.cartbtn{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:9px 15px;border-radius:999px;background:rgba(245,246,247,.5)}
.cartbtn b{font-weight:500}
.cartbtn .cnt{background:var(--ink);color:#eef0f2;border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;padding:0 6px}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:28px;padding:28px 32px 80px;max-width:1600px;margin:0 auto}
aside{position:sticky;top:86px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-right:6px;scrollbar-width:thin}
.fgroup{border-top:1px solid var(--line);padding:16px 0}
.fgroup:first-child{border-top:0;padding-top:0}
.ftitle{color:var(--mute);margin-bottom:12px;display:flex;justify-content:space-between}
.seclist button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:14px;transition:background .15s}
.seclist button:hover{background:rgba(255,255,255,.45)}
.seclist button.on{background:var(--ink);color:#eef0f2}
.seclist button span{opacity:.5;font-size:12px}
.chk{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px;cursor:pointer}
.chk input{accent-color:var(--ink);width:15px;height:15px}
.chk span.c{margin-left:auto;color:var(--mute);font-size:12px}
.brandlist{max-height:260px;overflow:auto}
.price{display:flex;gap:8px}
.price input{width:100%;border:1px solid var(--line);background:rgba(245,246,247,.6);border-radius:8px;padding:8px 10px;font-size:13px;outline:none}
.reset{color:var(--mute);text-decoration:underline;font-size:13px;margin-top:6px}
main{min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
h1{font-weight:200;font-size:clamp(34px,4vw,58px);letter-spacing:-.04em;line-height:1}
.found{color:var(--mute);margin-top:10px}
.sort{display:flex;align-items:center;gap:10px}
.sort select{border:1px solid var(--line);background:rgba(245,246,247,.6);border-radius:999px;padding:9px 14px;font-size:13px;outline:none}
.subs{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:thin}
.subs button{white-space:nowrap;border:1px solid var(--line);padding:7px 13px;border-radius:999px;font-size:13px;background:rgba(245,246,247,.4)}
.subs button.on{background:var(--ink);color:#eef0f2;border-color:var(--ink)}
.drawer{visibility:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s linear .4s}.drawer.show{visibility:visible;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
@media(max-width:900px){aside{visibility:hidden;transition:transform .35s,visibility 0s linear .35s}aside.show{visibility:visible;transition:transform .35s}}
.subs button.back{background:transparent;color:var(--ink);font-weight:600;border-style:dashed}
@media(max-width:900px){.subs{margin:0 -16px 16px;padding:0 16px 6px;scrollbar-width:none}.subs::-webkit-scrollbar{display:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:14px}
.card{background:rgba(240,241,243,.72);border:1px solid rgba(255,255,255,.6);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px rgba(28,30,33,.45);background:#f3f4f5}
.tile{aspect-ratio:1/1;border-radius:11px;background:radial-gradient(90% 90% at 50% 35%,#f4f5f6 0%,#dfe1e4 70%,#d3d6da 100%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.tile svg{width:62%;height:62%;filter:drop-shadow(0 14px 16px rgba(28,30,33,.18))}
.tile .ph{width:80%;height:80%;object-fit:contain;mix-blend-mode:multiply}
.mimg .mph{width:74%;height:74%;max-height:420px;object-fit:contain;mix-blend-mode:multiply}
.badges{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
.bdg{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:rgba(245,246,247,.85);color:var(--ink)}
.bdg.dark{background:var(--ink);color:#eef0f2}
.bdg.red{background:var(--red);color:#fff}
.bdg.wr{background:#1c1e21;color:#fff}
.mimg .badges{left:16px;top:16px}.mimg .bdg{font-size:11px;padding:6px 9px}
.cname{font-size:13.5px;line-height:1.35;min-height:54px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cbrand{color:var(--mute);font-size:10px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.cprice{font-size:18px;font-weight:500;letter-spacing:-.02em;white-space:nowrap}
.add{border-radius:999px;background:var(--ink);color:#eef0f2;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;transition:transform .2s,background .2s;flex:none}
.add:hover{transform:scale(1.07);background:#000}
.add.done{background:#4d7a5a}
.add:disabled{background:#b9bcc0;cursor:not-allowed}
.more{display:flex;justify-content:center;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--ink);color:#eef0f2;padding:14px 26px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:background .2s,transform .2s}
.btn:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.5)}
.btn:disabled{background:#b9bcc0;cursor:not-allowed}
.empty{padding:80px 0;text-align:center;color:var(--mute)}
.mfilter{display:none}
/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(28,30,33,.35);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.ov.show{opacity:1;visibility:visible}
.modal{position:fixed;z-index:51;left:50%;top:50%;width:min(980px,94vw);max-height:90vh;overflow:auto;transform:translate(-50%,-46%);opacity:0;visibility:hidden;transition:all .35s cubic-bezier(.2,.8,.2,1);background:#eceef0;border-radius:22px;display:grid;grid-template-columns:1.05fr 1fr;box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
.modal.show{transform:translate(-50%,-50%);opacity:1;visibility:visible}
.mimg{background:radial-gradient(90% 90% at 50% 35%,#f6f7f8 0%,#dfe1e4 70%,#cfd2d6 100%);display:flex;align-items:center;justify-content:center;min-height:440px;border-radius:22px 0 0 22px;position:relative}
.mimg svg{width:58%;height:58%;filter:drop-shadow(0 30px 30px rgba(28,30,33,.25))}
.mbody{padding:34px 34px 30px;display:flex;flex-direction:column;gap:16px}
.mbody h2{font-weight:300;font-size:26px;line-height:1.2;letter-spacing:-.02em}
.mprice{font-size:34px;font-weight:400;letter-spacing:-.03em}
.mmeta{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px;border-top:1px solid var(--line);padding-top:16px}
.mmeta dt{color:var(--mute)}
.pay{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.pay .row{display:flex;gap:10px;align-items:flex-start}
.pay .row i{font-style:normal;width:18px;flex:none;text-align:center}
.pay .off{color:var(--mute)}
.x{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:50%;background:rgba(245,246,247,.85);display:flex;align-items:center;justify-content:center;font-size:20px;z-index:2}
.qtyrow{display:flex;gap:12px;align-items:center;margin-top:4px}
/* drawer */
.drawer{position:fixed;z-index:52;right:0;top:0;bottom:0;width:min(460px,100vw);background:#eceef0;transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-30px 0 60px -30px rgba(0,0,0,.4)}
.drawer.show{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
.dhead h3{font-weight:300;font-size:24px;letter-spacing:-.02em}
.dbody{flex:1;overflow:auto;padding:12px 24px}
.ditem{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ditem .t{width:64px;height:64px;border-radius:10px;background:var(--tile);display:flex;align-items:center;justify-content:center}
.ditem .t svg{width:70%;height:70%}
.ditem .nm{font-size:13px;line-height:1.3}
.ditem .pr{font-weight:500;margin-top:6px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{width:30px;height:30px;font-size:16px}
.qty span{min-width:22px;text-align:center;font-size:13px}
.dfoot{padding:18px 24px 24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total b{font-size:26px;font-weight:400;letter-spacing:-.02em}
form.co{display:flex;flex-direction:column;gap:10px}
form.co input,form.co textarea{border:1px solid var(--line);background:rgba(250,250,251,.7);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;font-family:inherit;resize:none}
form.co input:focus,form.co textarea:focus{border-color:rgba(28,30,33,.4)}
.paysel{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.payopt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px;background:rgba(250,250,251,.5)}
.payopt input{accent-color:var(--ink);margin-top:3px}
.payopt small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.payopt.on{border-color:var(--ink)}
.warn{display:none;background:#f3e6e6;color:var(--red);border-radius:10px;padding:10px 12px;font-size:13px}
.warn.show{display:block}
.note{font-size:12px;color:var(--mute);line-height:1.45}
.done{text-align:center;padding:40px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .ok{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:60;background:var(--ink);color:#eef0f2;padding:12px 18px;border-radius:10px;opacity:0;transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){
 header{padding:12px 16px;gap:10px;flex-wrap:wrap} .hnav{display:none} .cartbtn .cl{display:none} .cartbtn{padding:9px 12px} .search{order:3;max-width:none;flex-basis:100%}
 .wrap{grid-template-columns:1fr;padding:18px 16px 60px}
 aside{position:fixed;inset:0;z-index:55;background:#eceef0;max-height:none;padding:20px;transform:translateX(-100%);transition:transform .35s}
 aside.show{transform:none}
 .mfilter{display:inline-flex}
 .grid{grid-template-columns:repeat(2,1fr);gap:10px}
 .cprice{font-size:15px} .add{width:34px;height:34px}
 .modal{grid-template-columns:1fr;top:auto;bottom:0;left:0;width:100vw;transform:translateY(30px);border-radius:22px 22px 0 0;max-height:92vh}
 .modal.show{transform:none}
 .mimg{min-height:260px;border-radius:22px 22px 0 0}
 .top{flex-direction:column;align-items:flex-start}
}
.fscroll{max-height:236px;overflow:auto;padding-right:4px}
.fmore{margin-top:8px;background:none;border:0;padding:4px 0;font:inherit;font-size:13px;color:#555;text-decoration:underline;cursor:pointer}
</style>
<script src="analytics.js"></script>
</head>
<body>

<script>
(function(){
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('ru-RU').replace(/,/g,' ')+' ₽';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,ITEMS=[],IDS=[],IDX={},PH={};
function ecomP(i,q){const it=ITEMS[i];return {id:IDS[i],name:it[3],price:it[4],brand:it[1]>=0?D.brands[it[1]]:'',category:D.sections[it[0]]+'/'+D.subs[it[2]],quantity:q||1};}
const G=(g,p)=>{try{window.atommGoal&&atommGoal(g,p)}catch(e){}},EC=(a,p,f)=>{try{window.atommEcom&&atommEcom(a,p,f)}catch(e){}};
function pic(i,cls){const f=PH[IDS[i]];return f?`<img class="${cls}" src="img/${f}" alt="${esc(ITEMS[i][3])}" loading="lazy" decoding="async" onerror="this.outerHTML=''">`:'';}
const S={sec:-1,brands:new Set(),f:{},sub:-1,q:'',pmin:0,pmax:0,stock:true,onlyNew:false,sort:'pop',shown:48};

/* ---------- colours from product names ---------- */
const COL=[[/глубок\S* син|deep blue|тёмно-син|темно-син|midnight|полночь/i,'#2f3d57'],[/космич\S* оранж|cosmic orange|оранж|orange/i,'#d77436'],
 [/чёрн|черн|black|обсидиан|obsidian|graphite|графит|space black|jet/i,'#2a2b2e'],[/бел|white|starlight|сияющ|pearl|перламутр|cloud/i,'#f2f1ee'],
 [/серебр|silver|natural|натурал/i,'#d6d8db'],[/сер|gray|grey|space gray|титан|titanium/i,'#8e9196'],[/небесн|голуб|sky|light blue|mist blue/i,'#a9c3dc'],
 [/син|blue|ultramarine|ультрамарин|navy/i,'#4a6797'],[/зел|green|sage|mint|оливк|teal|бирюз/i,'#7f9c83'],[/роз|pink|rose/i,'#e6b9c2'],
 [/фиолет|лаванд|purple|violet|lavender|пурпур/i,'#a998cf'],[/золот|gold|desert|пустын|бронз|bronze|медн|copper/i,'#cdb48c'],
 [/красн|red|бордов|burgundy/i,'#b2393d'],[/жёлт|желт|yellow|лимон/i,'#e5cf6a'],[/коричн|brown|беж|beige|sand/i,'#b49a7d']];
function colorOf(n){const m=n.match(/цвет[^:]*:\s*([^,(]+)(\(([^)]+)\))?/i);const s=m?(m[1]+' '+(m[3]||'')):n;for(const[r,c]of COL)if(r.test(s))return c;return '#c9ccd0';}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k)));return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1);}

/* ---------- illustrations ---------- */
const ICON_SECS=['Смартфоны','Планшеты','Ноутбуки и компьютеры','Часы и браслеты','Аудио','Игры и приставки','Техника для дома и красоты','Камеры и дроны','Конструкторы Lego','Аксессуары'];
function icon(sec,name){
  if(D){const k=ICON_SECS.indexOf(D.sections[sec]);sec=k<0?9:k;}
  const c=colorOf(name),d=shade(c,-.28),l=shade(c,.35),gid='g'+Math.random().toString(36).slice(2,8);
  const grad=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${l}"/><stop offset="1" stop-color="${d}"/></linearGradient></defs>`;
  const F=`url(#${gid})`;
  const nm=name.toLowerCase();

const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;

function adjNorm(w){if(/^(голуб|золот|морск|густ)(ая|ое|ые)$/.test(w))return w.replace(/(ая|ое|ые)$/,'ой');return w.replace(/(ая|ое|ые)$/,'ый').replace(/(яя|ие|ее)$/,'ий').replace(/([гкх])ый$/,'$1ий').replace(/([жшчщ])ый$/,'$1ий');}
function cleanColor(c){c=(c||'').replace(/ё/g,'е').replace(/\s+/g,' ').trim().replace(/[,;.:\s]+$/,'');
  if(!c||c.length>30||/[a-z]{3}/i.test(c)&&!/[а-я]/i.test(c))return '';
  if(/ssd|гб|тб|клав|версия|комплект|шумопод|заряд|мм\b|edition|подпис|^с |^для |гарант|ru\b/i.test(c))return '';

  const ps=[...n.matchAll(/\(([А-Яа-яЁё][А-Яа-яЁё\-\/ ]*)\)/g)];for(let i=ps.length-1;i>=0;i--){const c=cleanColor(ps[i][1]);if(c&&!/\//.test(c))return c;}
  return '';}
function memOf(n){const m=n.match(/\d+\s*\/\s*(\d+)\s*(ГБ|ТБ)?/i)||n.match(/(\d+)\s*(ГБ|ТБ)/i);return m?memVal(m[1],m[2]||'ГБ'):undefined;}
function attrsOf(sec,name){
  const n=name.replace(/М(?=\d)/g,'M').replace(/[ТT]Б/g,'ТБ').replace(/\bGb\b/gi,'ГБ').replace(/\bTb\b/gi,'ТБ').replace(/с Touch ID\s*/i,'');const a={};
  let m;const col=()=>{const c=colorOf(n);if(c)a.color=c;};
  if(sec==='Смартфоны'){
    if(!/^(телефон|смартфон)/i.test(n))return a;
    const v=memOf(n);if(v)a.mem=v;col();
    if(/dual\s*sim|две\s*sim|2\s*sim|две физ/i.test(n))a.sim='2 nano-SIM';
    else if(/esim\s*\(электрон|только esim|esim only/i.test(n))a.sim='Только eSIM';
    else if(/iphone/i.test(n))a.sim='nano-SIM + eSIM';
  } else if(sec==='Планшеты'){
    if(!/^планшет/i.test(n))return a;
    const v=memOf(n);if(v&&v>=32)a.mem=v;col();
    a.net=/cellular|сотов|\blte\b|\b5g\b|\b4g\b/i.test(n)?'Wi-Fi + сотовая связь':'Только Wi-Fi';
    if(m=n.match(/iPad\s+(?:Pro|Air)?\s*(1[1-3])\b/i))a.diag=+m[1];
  } else if(sec==='Часы и браслеты'){
    if(m=n.match(/(\d{2})\s*мм/))a.size=+m[1];
    a.net=/cellular|\blte\b|esim/i.test(n)?'С сотовой связью':'Без сотовой связи';
    if(m=n.match(/корпус:?\s+(алюминий|титан|керамика|сталь|нержавеющая сталь)?\s*([^(,]+)/i)){
      if(m[1])a.mat=cap(m[1]);else if(m=n.match(/корпус:?\s+[^(,]*?(титан|алюмини\S*|керамик\S*)/i))a.mat=/титан/i.test(m[1])?'Титан':/алюм/i.test(m[1])?'Алюминий':'Керамика';
      const mm=n.match(/корпус:?\s+(?:алюминий|титан|керамика|сталь)?\s*([^(,]+)/i);const c=cleanColor(mm&&mm[1]);if(c)a.color=c;else col();}
    else col();
  } else if(sec==='Ноутбуки и компьютеры'){
    m=n.match(/\b(M\d)(\s+(?:Pro|Max|Ultra))?\b/);

    m=n.match(/(\d+)\s*(ГБ|ТБ)\s*SSD/i);if(m)a.ssd=memVal(m[1],m[2]);
    m=n.match(/(\d+)\s*\/\s*\d+\s*(?:ГБ|ТБ)\s*SSD/i);
    if(m)a.ram=+m[1];else if(m=n.match(/(\d+)\s*ГБ\s*,\s*\d+\s*(?:ГБ|ТБ)\s*SSD/i))a.ram=+m[1];

    else if(m=n.match(/SSD\)?\s*,?\s*([А-Яа-яЁё][А-Яа-яЁё\- ]+?)\s*(?:\(|[A-Z0-9]{4,}|$)/))a.color=cleanColor(m[1]);
    else col();
    if(!a.color)delete a.color;
  } else if(sec==='Игры и приставки'){
    if(/switch\s*2/i.test(n))a.plat='Nintendo Switch 2';else if(/switch/i.test(n))a.plat='Nintendo Switch';
    else if(/ps5|playstation\s*5|playstation portal/i.test(n))a.plat='PlayStation 5';else if(/ps4|playstation\s*4/i.test(n))a.plat='PlayStation 4';
    else if(/xbox/i.test(n))a.plat='Xbox';else if(/steam deck/i.test(n))a.plat='Steam Deck';

      /клавиатур|мыш|стилус|трекпад/.test(t)?'Клавиатуры, мыши, стилусы':/держател|крепление|подставк/.test(t)?'Держатели и подставки':
      /пылесос|моющий|турбощетк|щетк|фильтр/.test(t)?'Для пылесосов':'Другое';
    if(m=n.match(/iPhone\s+(\d{2}e?|Air)(?:\s+(Pro\s+Max|Pro|Plus|mini))?/i))a.dev='iPhone '+m[1]+(m[2]?' '+m[2].replace(/\s+/,' '):'');
    else if(/ipad/i.test(n))a.dev='iPad';else if(/apple watch/i.test(n))a.dev='Apple Watch';else if(/airpods/i.test(n))a.dev='AirPods';
    else if(/macbook|imac|mac mini/i.test(n))a.dev='Mac';else if(/galaxy/i.test(n))a.dev='Samsung Galaxy';else if(/airtag/i.test(n))a.dev='AirTag';
    else if(/pixel/i.test(n))a.dev='Google Pixel';else if(/xiaomi|redmi|poco/i.test(n))a.dev='Xiaomi';else if(/huawei/i.test(n))a.dev='Huawei';
    if(a.type!=='Защитные стекла и пленки')col();
  } else col();
  return a;
}

function devKey(v){const m=v.match(/^iPhone (\d+|Air)(e)?(?: (.*))?$/);if(!m)return [1,0,0];const g=m[1]==='Air'?17:+m[1];const t=m[2]?0:m[1]==='Air'?3:({'Pro Max':5,'Pro':4,'Plus':2,'mini':0.5}[m[3]]||1);return [0,-g,-t];}
const SIM_ORDER=['nano-SIM + eSIM','Только eSIM','2 nano-SIM'];

function facetLbl(k,v){if(k==='mem'||k==='ssd')return memLbl(v);if(k==='ram')return v+' ГБ';if(k==='diag')return v+'″';if(k==='size')return v+' мм';if(k==='sim')return SIM_LBL[v]||v;return v;}
function chipKey(v){const ap=v.startsWith('Apple')?0:1;const m=v.match(/(\d+)/);const t=/Max/.test(v)?3:/Pro/.test(v)?2:/Ultra/.test(v)?4:1;return [ap,v.replace(/\d.*$/,''),m?+m[1]:0,t];}
function facetSort(k,vals,cnt){
  if(NUMF.has(k))return vals.sort((a,b)=>a-b);
  if(FIXED_ORDER[k])return vals.sort((a,b)=>FIXED_ORDER[k].indexOf(a)-FIXED_ORDER[k].indexOf(b));
  if(k==='dev')return vals.sort((a,b)=>{const x=devKey(a),y=devKey(b);for(let i=0;i<3;i++)if(x[i]!==y[i])return x[i]-y[i];return x[0]?cnt[b]-cnt[a]:0;});
  if(k==='sim')return vals.sort((a,b)=>SIM_ORDER.indexOf(a)-SIM_ORDER.indexOf(b));
  if(k==='chip')return vals.sort((a,b)=>{const x=chipKey(a),y=chipKey(b);for(let i=0;i<4;i++){if(x[i]<y[i])return -1;if(x[i]>y[i])return 1;}return 0;});

const norm=s=>s.toLowerCase().replace(/ё/g,'е');
let NAMES=[];
function baseFiltered(ignoreBrand,ignoreSub,ignoreFacet){
  const fk=Object.keys(S.f).filter(k=>k!==ignoreFacet&&S.f[k].size);
  const words=norm(S.q).split(/\s+/).filter(Boolean);
  const res=[];
  for(let i=0;i<ITEMS.length;i++){const it=ITEMS[i];
    if(S.sec>=0&&it[0]!==S.sec)continue;
    if(!ignoreSub&&S.sub>=0&&it[2]!==S.sub)continue;
    if(!ignoreBrand&&S.brands.size&&!S.brands.has(it[1]))continue;
    if(S.stock&&!it[5])continue;
    if(fk.length){const a=ATTR[i];let ok=true;for(const k of fk)if(!S.f[k].has(a[k])){ok=false;break;}if(!ok)continue;}
    if(S.onlyNew&&it[6]!==0)continue;
    if(S.pmin&&it[4]<S.pmin)continue;
    if(S.pmax&&it[4]>S.pmax)continue;
    if(words.length){const n=NAMES[i];let ok=true;for(const w of words)if(!n.includes(w)){ok=false;break;}if(!ok)continue;}
    res.push(i);}
  return res;
}

    'ipad':{sec:sec('Планшеты'),b:'Apple'},'watch':{sec:sec('Часы и браслеты'),b:'Apple'},'airpods':{q:'AirPods'},
    'samsung':{b:'Samsung'},'dyson':{b:'Dyson'},'playstation':{q:'PlayStation'}};
  if(h==='cart'){setTimeout(()=>openCart(),0);return;}
  if(h.startsWith('item-')){const i=IDX[h.slice(5)];if(i!==undefined)openItem(i);return;}
  if(h.startsWith('sub=')){const k=D.subs.indexOf(decodeURIComponent(h.slice(4)));if(k>=0){const it=ITEMS.find(x=>x[2]===k);if(it){S.sec=it[0];S.sub=k;}}return;}
  const p=P[h];if(!p)return;
  if(p.sec!=null)S.sec=p.sec;if(p.b&&br(p.b)>=0)S.brands.add(br(p.b));if(p.q){S.q=p.q;$('#q').value=p.q;}
}

fetch('img/index.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{}).then(j=>{PH=j||{};if(D)render();}).catch(()=>{});
fetch('catalog.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{D=d;IDS=d.items.map(r=>r[0]);ITEMS=d.items.map(r=>r.slice(1));IDS.forEach((id,i)=>IDX[id]=i);ATTR=ITEMS.map(it=>attrsOf(d.sections[it[0]],it[3]));NAMES=ITEMS.map(it=>norm(it[3]+' '+(it[1]>=0?d.brands[it[1]]:'')+' '+d.subs[it[2]]));
  applyHash();updCartBtn();render();}).catch(()=>{$('#grid').innerHTML='<div class="empty">Не удалось загрузить каталог.</div>';});
})();
</script>
<script src="menu.js"></script>
